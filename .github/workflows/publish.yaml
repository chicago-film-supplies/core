name: Release & Publish

on:
  push:
    branches:
      - main
      - beta
      - pre-*
      - beta-*

  # Manual trigger, because a lost run used to cost a junk commit.
  #
  # `push` was the only trigger, so whenever a run was lost the only way to get a
  # publish was to invent a commit — and `285c50f` is exactly that: an empty
  # `feat(propagation):` whose entire content is "re-trigger the publish". It
  # didn't even work; the 2026-08-06 GitHub Actions outage was what had eaten the
  # run, and the outage then ate the re-trigger too.
  #
  # `gh run rerun` is NOT a substitute. It only works on a *completed* run, and
  # the outage left run 31127279580 in a state where both verbs refused it:
  # `rerun` said "cannot be rerun; its workflow file may be broken" while
  # `cancel` said "cannot cancel a workflow run that is completed" — on a run the
  # API reported as `queued`. Inconsistent, and not self-healing.
  #
  # Safe to fire at will: semantic-release derives the version from the commits
  # since the last tag, so a dispatch with nothing releasable is a no-op rather
  # than a duplicate or an empty version bump.
  #
  #   gh workflow run "Release & Publish" --ref beta -R chicago-film-supplies/core
  workflow_dispatch:

jobs:
  # Every check core has, from the one place they are defined. On this workflow
  # `release` has `needs: ci`, so nothing reaches JSR that has not passed all of
  # them — including the four (Generated files, Declarations, Citations,
  # Publish dry-run) this job did NOT have while it held its own copy.
  ci:
    uses: ./.github/workflows/checks.yaml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # PINNED EXACTLY, and the preset is deliberately a major behind.
      #
      # This line was unpinned and a transitive dependency published on
      # 2026-08-18T21:37Z broke every publish three hours later:
      # `@conventional-changelog/template@1.4.0` added a guard that REFUSES
      # `conventional-changelog-writer@8`, and `release-notes-generator@14.1.1`
      # — the current latest — still depends on `^8.0.0`. The run died at
      # `generateNotes` with `Missing helper: "conventional-changelog-
      # conventionalcommits requires conventional-changelog-writer@9 or newer"`.
      #
      # ⚠️ `conventional-changelog-conventionalcommits` is held at **9.3.1**,
      # not at latest. Its 10.x line depends on `@conventional-changelog/
      # template ^1.x` and so drags that floating chain back in; 9.3.1 depends
      # on `compare-func` alone and pairs with writer@8. Bump it only together
      # with a `release-notes-generator` that has moved to writer@9.
      #
      # Nothing about the failure was visible before the push: the release job
      # resolves these at run time, so a green local tree and a green CI job say
      # nothing about whether a publish will succeed. Pinning is what makes the
      # answer a property of this file.
      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@25.0.9 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.1 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@11.0.1 \
            @semantic-release/github@12.0.9 \
            conventional-changelog-conventionalcommits@9.3.1

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release
