name: CI

# PRs and manual runs only. `push` lives in `.github/workflows/publish.yaml`,
# whose `ci` job calls the same reusable `.github/workflows/checks.yaml` and
# then gates `release` on it — so a push to `main`/`beta` still runs every check
# here, exactly once, before anything reaches JSR.
#
# ⚠️ This is core#54 item 4, and the item as written was WRONG when it came up.
# It argued dropping `push` was zero-risk because `publish.yaml`'s `ci` job was
# a verbatim copy of this file's. It had stopped being one: this file had gained
# Generated files, Declarations, Citations and Publish dry-run, and `push` is
# the only trigger that fires on this repo's actual workflow — core is committed
# to directly on `beta`, so a PR is the exception, not the rule. Dropping the
# trigger first would have silently taken four gates off the publish path.
# Extracting the shared job is what made the item's own premise true.
on:
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/checks.yaml
